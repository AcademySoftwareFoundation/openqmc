# Releases are signed via https://github.com/sigstore/sigstore-python.
# See https://docs.sigstore.dev for information about sigstore.
#
# This action creates a .tar.gz of the complete OpenQMC source tree at
# the given release tag, signs it via sigstore, and uploads the
# .tar.gz and the associated .tar.gz.sigstore.json credential bundle.
#
# To verify a downloaded release at a given tag:
#
#   % pip install sigstore
#   % sigstore verify github --cert-identity https://github.com/AcademySoftwareFoundation/openqmc/.github/workflows/release-sign.yml@refs/tags/<tag> openqmc-<version>.tar.gz
#
# <version> is <tag> without the leading 'v'.
#
# To sign an existing release after publish (e.g. workflow fix): Actions →
# Sign Release → Run workflow → enter the release tag (e.g. v0.7.1).

name: Sign Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v0.7.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Sign & upload release artifacts
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write   # required for gh release upload (attach assets)
      id-token: write   # required for sigstore OIDC signing
    steps:

      - name: Set Prefix
        # The tag name begins with a 'v', e.g. "v0.7.1", but the prefix
        # should omit the 'v', so the tarball "openqmc-0.7.1.tar.gz"
        # extracts files into "openqmc-0.7.1/...".  This matches
        # the GitHub release page autogenerated artifact conventions.
        run: |
          echo OPENQMC_PREFIX=openqmc-${TAG//v}/ >> $GITHUB_ENV
          echo OPENQMC_TARBALL=openqmc-${TAG//v}.tar.gz >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Create archive
        run: git archive --format=tar.gz -o ${OPENQMC_TARBALL} --prefix ${OPENQMC_PREFIX} ${TAG}

      - name: Sign archive with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ${{ env.OPENQMC_TARBALL }}
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${TAG} ${OPENQMC_TARBALL} ${OPENQMC_TARBALL}.sigstore.json
